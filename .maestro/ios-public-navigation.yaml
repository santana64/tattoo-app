# Public staging-only navigation. No accounts, payments, or backend writes.
# Unlike a process-liveness smoke, this must see and interact with real UI.
appId: com.inkr.tattoo
tags:
  - native-smoke
---
- launchApp:
    clearState: true
# React Native groups ArtistChip children into one accessible Pressable label:
# "Mara Test, <booking status>". Maestro matches the *full* label as regex;
# the former exact "Mara Test" selector failed although the artist was visibly
# rendered in pre- and post-Maestro screenshots. Match the composite label,
# retain the real staging-data assertion, and require actual tab navigation.
- extendedWaitUntil:
    visible: ".*Mara Test.*"
    timeout: 60000
- tapOn:
    text: ".*Rechercher.*"
- extendedWaitUntil:
    visible: ".*02 / DÉCOUVRIR.*"
    timeout: 30000
- extendedWaitUntil:
    visible: ".*2 ARTISTES.*"
    timeout: 30000
- tapOn:
    text: ".*Se connecter.*"
- extendedWaitUntil:
    visible: ".*Entrez dans.*"
    timeout: 30000
