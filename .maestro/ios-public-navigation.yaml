# Public staging-only navigation. No accounts, payments, or backend writes.
# Unlike a process-liveness smoke, this must see and interact with real UI.
appId: com.inkr.tattoo
tags:
  - native-smoke
---
- launchApp:
    clearState: true
# First launch may open the editorial welcome, not the public feed.
# If it does, enter via its actual public browsing CTA.
- runFlow:
    when:
      visible: "Découvrir les artistes"
    commands:
      - tapOn:
          text: "Découvrir les artistes"
# On returning users, the public feed opens directly. On first launch,
# the previous conditional already navigates from Welcome to Explore.
- runFlow:
    when:
      visible: "Mara Test"
    commands:
      - tapOn:
          text: "Rechercher"
- extendedWaitUntil:
    visible: "02 / DÉCOUVRIR"
    timeout: 30000
- extendedWaitUntil:
    visible: "2 ARTISTES"
    timeout: 30000
- tapOn:
    text: "Se connecter"
- extendedWaitUntil:
    visible: "Entrez dans"
    timeout: 30000
