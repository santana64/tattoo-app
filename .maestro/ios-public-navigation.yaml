# Public staging-only navigation. No accounts, payments, or backend writes.
# Unlike a process-liveness smoke, this must see and interact with real UI.
appId: com.inkr.tattoo
tags:
  - native-smoke
---
- launchApp:
    clearState: true
# In an actual iOS 18.5 simulator the initial public route renders "Mara
# Test" and the bottom "Rechercher" tab. Previously runFlow(when: visible)
# checked the artist *before* the Supabase feed had rendered, skipped its tap,
# and then incorrectly expected Explore while still on Home. Wait for real
# staging data, and make the tap mandatory.
- extendedWaitUntil:
    visible: "Mara Test"
    timeout: 60000
- tapOn:
    text: "Rechercher"
- extendedWaitUntil:
    visible: "02 / DÉCOUVRIR"
    timeout: 30000
- extendedWaitUntil:
    visible: "2 ARTISTES"
    timeout: 30000
- tapOn:
    text: "Se connecter"
- extendedWaitUntil:
    visible: "Entrez dans"
    timeout: 30000
